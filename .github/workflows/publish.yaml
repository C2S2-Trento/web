name: Build and publish C2S2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.135.0'
          extended: true
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-publications.txt
      - name: Import BibTeX publications
        run: |
          python -m pip install -r requirements-publications.txt
          python -m unittest discover -s tests -v
          python scripts/import_publications.py
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "$PAGES_URL" ]; then
            hugo --minify --baseURL "${PAGES_URL}/"
          else
            hugo --minify
          fi
      - name: Check local links
        run: python3 scripts/check_site.py public
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
