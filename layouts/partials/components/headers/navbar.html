<a class="c2-skip" href="#main-content">Skip to content</a>
<header class="c2-header"><nav class="c2-nav" aria-label="Main navigation"><a class="c2-brand" href="{{ site.Home.RelPermalink }}" aria-label="C2S2 home">C2S2<span>COMPUTATIONAL<br>SOCIAL SCIENCE</span></a><button class="c2-menu-toggle" type="button" aria-controls="c2-menu" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button><ul id="c2-menu">{{ range site.Menus.main }}<li><a href="{{ .URL | relURL }}"{{ if eq ($.RelPermalink | strings.TrimSuffix "/") ((.URL | relURL) | strings.TrimSuffix "/") }} aria-current="page"{{ end }}>{{ .Name }}</a></li>{{ end }}</ul></nav></header>
<script>document.querySelector('.c2-menu-toggle').addEventListener('click',function(){const open=this.getAttribute('aria-expanded')!=='true';this.setAttribute('aria-expanded',String(open));document.querySelector('#c2-menu').classList.toggle('is-open',open)});document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.querySelector('#c2-menu').classList.remove('is-open');document.querySelector('.c2-menu-toggle').setAttribute('aria-expanded','false')}});</script>
