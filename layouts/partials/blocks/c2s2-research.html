{{ $c := .wcBlock.content }}
<div class="c2-section-heading"><div><p class="c2-eyebrow">{{ $c.eyebrow }}</p><h2>{{ $c.title }}</h2></div><p>{{ $c.text }}</p></div>
<div class="c2-research-grid">{{ range (where site.RegularPages "Section" "research").ByWeight }}<a class="c2-research-card" href="{{ .RelPermalink }}"><span class="c2-card-number">0{{ .Weight }} / RESEARCH</span><h3>{{ .Title }}</h3><p>{{ .Params.summary }}</p><span class="c2-card-arrow" aria-hidden="true">↗</span></a>{{ end }}</div>
